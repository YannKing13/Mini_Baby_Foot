'use strict';const c=document.getElementById('c'),g=c.getContext('2d');let W,H,S,ox,oy,last=0,started=false,over=false,score=[0,0],goalLimit=5,active=2,drag=null,flash=0,msg='TOUCHE POUR COMMENCER',sound=true;const T={w:1000,h:540,l:72,r:928,t:65,b:475,cy:270};const rods=[{x:125,n:1,team:0},{x:250,n:2,team:0},{x:385,n:5,team:0},{x:665,n:3,team:0},{x:875,n:1,team:1},{x:750,n:2,team:1},{x:615,n:5,team:1},{x:335,n:3,team:1}];rods.forEach((r,i)=>{r.id=i;r.y=0;r.v=0;r.kick=0;r.cool=0;r.aiTarget=0});const ball={x:500,y:270,vx:0,vy:0,r:9,spin:0};let audio;function beep(freq,dur,type='sine',vol=.08){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);v.gain.setValueAtTime(vol,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;S=Math.min(W/1050,H/610);ox=(W-1000*S)/2;oy=(H-540*S)/2}addEventListener('resize',resize);resize();function pos(e){return{x:(e.clientX*devicePixelRatio-ox)/S,y:(e.clientY*devicePixelRatio-oy)/S}}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function positions(r){let gap=r.n===1?0:r.n===2?160:r.n===3?115:76;return Array.from({length:r.n},(_,i)=>270+r.y+(i-(r.n-1)/2)*gap)}function limit(r){return r.n===5?34:r.n===3?75:r.n===2?110:165}function reset(dir=1){ball.x=500;ball.y=270;ball.vx=dir*220;ball.vy=(Math.random()-.5)*150;ball.spin=0;rods.forEach(r=>{r.y=0;r.kick=0;r.cool=0})}function goal(team){score[team]++;beep(520,.18,'triangle',.17);setTimeout(()=>beep(780,.25,'triangle',.15),130);flash=1;msg='BUUUT ! '+(team===0?'BLEUS':'ROUGES');if(score[team]>=goalLimit){over=true;msg=(team===0?'BLEUS':'ROUGES')+' GAGNENT ! — TOUCHE POUR REJOUER'}else reset(team===0?-1:1)}function pointer ',.025)}if(ball.y+ball.r>T.b){ball.y=T.b-ball.r;ball.vy=-Math.abs(ball.vy)*.88;beep(125,.03,'triangle',.025)}let mouth=74;if(ball.x<T.l-ball.r){if(Math.abs(ball.y-T.cy)<mouth){goal(1);return}else{ball.x=T.l+ball.r;ball.vx=Math.abs(ball.vx)*.82}}if(ball.x>T.r+ball.r){if(Math.abs(ball.y-T.cy)<mouth){goal(0);return}else{ball.x=T.r-ball.r;ball.vx=-Math.abs(ball.vx)*.82}}for(let r of rods){if(Math.abs(ball.x-r.x)>26)continue;for(let py of positions(r)){let dx=ball.x-r.x,dy=ball.y-py;if(Math.abs(dx)<23&&Math.abs(dy)<22){let direction=r.team===0?1:-1;if((ball.vx*direction<400)||r.kick>.1){ball.x=r.x+direction*24;let power=r.kick>.1?620:340;ball.vx=direction*(power+Math.random()*85);ball.vy=clamp(dy*15+r.v*.28,-390,390);ball.spin=clamp(r.v*.08,-90,90);r.kick=0;beep(210,.055,'triangle',.08)}break}}}if(Math.hypot(ball.vx,ball.vy)>950){ball.vx*=.95;ball.vy*=.95}flash=Math.max(0,flash-dt*1.6)}function rect(x,y,w,h,fill,r=0){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function line(x,y,X,Y,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}function draw(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#101922';g.fillRect(0,0,W,H);g.setTransform(S,0,0,S,ox,oy);rect(20,12,960,516,'#7b4b2b',25);rect(32,22,936,496,'#a96a38',20);rect(51,45,898,450,'#26332b',10);rect(T.l,T.t,T.r-T.l,T.b-T.t,'#146d43');for(let i=0;i<10;i++)rect(T.l+i*85.6,T.t,85.6,T.b-T.t,i%2?'#197c4a':'#167446');g.strokeStyle='#d6f5dd';g.lineWidth=3;g.strokeRect(T.l+2,T.t+2,T.r-T.l-4,T.b-T.t-4);line(500,T.t,500,T.b,'#d6f5dd',3);g.beginPath();g.arc(500,270,67,0,Math.PI*2);g.stroke();g.beginPath();g.arc(500,270,4,0,Math.PI*2);g.fillStyle='#e8fff0';g.fill();g.strokeRect(T.l,172,110,196);g.strokeRect(T.r-110,172,110,196);g.strokeRect(T.l,214,45,112);g.strokeRect(T.r-45,214,45,112);rect(39,195,33,150,'#15191c',5);rect(928,195,33,150,'#15191c',5);for(let i=0;i<7;i++){line(40,196+i*24,71,220+i*20,'#c5c5c5',1);line(929,220+i*20,960,196+i*24,'#c5c5c5',1)}for(let r of rods){let col=r.team===0?'#258df5':'#ee4845';line(r.x,34,r.x,505,'#152026',10);line(r.x,34,r.x,505,'#bdc9cb',5);rect(r.x-11,r.team===0?13:493,22,35,r.team===0?'#186ab1':'#9c2727',6);for(let y of positions(r)){g.save();g.translate(r.x,y);g.shadowColor='#0008';g.shadowBlur=5;g.shadowOffsetY=4;rect(-16,-15,32,30,col,7);g.shadowBlur=0;g.shadowOffsetY=0;rect(-12,-12,24,7,r.team===0?'#72c4ff':'#ffaaa1',3);rect(-12,10,9,13,'#26313b',2);rect(3,10,9,13,'#26313b',2);rect(-8,-8,16,12,r.team===0?'#0861b5':'#aa252a',3);if(r.kick>.1){rect(r.team===0?8:-21,-10,13,20,'#e8e5d7',3)}g.restore()}}g.save();g.shadowColor='#0009';g.shadowBlur=9;g.shadowOffsetY=5;g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fillStyle='#f9f9e7';g.fill();g.restore();g.fillStyle='#333';for(let a=0;a<5;a++){let ang=a*Math.PI*2/5+performance.now()*.001;g.beginPath();g.arc(ball.x+Math.cos(ang)*4,ball.y+Math.sin(ang)*4,2.5,0,Math.PI*2);g.fill()}rect(355,4,290,47,'#111d28',10);g.textAlign='center';g.font='bold 27px Arial';g.fillStyle='#68b9ff';g.fillText(score[0],438,36);g.fillStyle='#fff';g.font='bold 17px Arial';g.fillText('—',500,35);g.fillStyle='#ff7772';g.font='bold 27px Arial';g.fillText(score[1],562,36);g.font='bold 12px Arial';g.fillStyle='#cbd5df';g.fillText('BLEUS',387,33);g.fillText('ROUGES',615,33);rect(792,7,178,32,'#182532',9);g.fillStyle='#f4f4f4';g.font='bold 14px Arial';g.fillText('🔊 SON : '+(sound?'ON':'OFF'),881,28);if(!started||over){rect(250,185,500,165,'#07131fe8',20);g.fillStyle='#fff';g.font='bold 27px Arial';g.fillText(over?msg:'MINI BABY-FOOT',500,237);g.font='17px Arial';g.fillText(over?'TOUCHE POUR REJOUER':'Glisse les barres bleues et touche pour tirer',500,277);g.font='14px Arial';g.fillText('Premier à 5 buts • Bleu contre IA rouge',500,308)}else if(flash>0){g.globalAlpha=flash;rect(360,228,280,76,'#07131f',14);g.fillStyle='#fff';g.font='bold 27px Arial';g.fillText(msg,500,274);g.globalAlpha=1}g.textAlign='left';g.fillStyle='#e8e8e8';g.font='12px Arial';g.fillText('
