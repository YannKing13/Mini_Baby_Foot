function v17DifferentShuffle(original){

}

function v18FinishCupMatch(){let t=tournament,m=t.rounds[t.round][matchIndex];if(!m)return;const a=m.a===playerTeamName?score[0]:score[1],b=m.b===playerTeamName?score[0]:score[1];m.legs.push([a,b]);const needed=t.round===3?1:2;
 if(m.legs.length>=needed){m.sa=m.legs.reduce((s,x)=>s+x[0],0);m.sb=m.legs.reduce((s,x)=>s+x[1],0);if(m.sa===m.sb){if(a>b)m.sa++;else if(b>a)m.sb++;else m.sa++}if(v18CupWinner(m)!==playerTeamName)t.eliminated=true}
 t.rounds[t.round].filter(x=>x!==m&&x.sa===null).forEach(x=>{while(x.sa===null)v18CupSimLeg(x)});v18AdvanceCup();saveCurrent();
}
function v18CupMenu(){
 menu.style.display='flex';document.getElementById('ttitle').textContent='🏆 COUPE DES CLUBS — 16 ÉQUIPES';status.textContent='Huitièmes, quarts et demies en aller-retour • Finale unique';bracket.innerHTML='';actions.innerHTML='';bracket.style.display='grid';bracket.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
 const t=tournament;const labels=['HUITIÈMES','QUARTS','DEMI-FINALES','FINALE'];
 for(let ri=0;ri<4;ri++){const col=document.createElement('div');col.className='round';const h=document.createElement('h3');h.textContent=labels[ri];col.append(h);for(const m of t.rounds[ri]){const d=document.createElement('div');d.className='match'+(m.sa!==null?' done':'');const leg=m.legs.length;d.textContent=m.a+' — '+m.b+(m.sa!==null?' • Cumul '+m.sa+':'+m.sb:leg?' • Aller '+m.legs[0].join(':')+' / Retour à jouer':' • À jouer');col.append(d)}bracket.append(col)}
 if(t.finished){const champion=v18CupWinner(t.rounds[3][0]);actions.innerHTML='<div class="trophy">🏆<div>'+escapeHtml(champion)+'</div><small>CHAMPION DE LA COUPE</small></div>'}
 else{const ms=t.rounds[t.round],mine=ms.find(m=>m.sa===null&&(m.a===playerTeamName||m.b===playerTeamName));if(mine&&!t.eliminated){const btn=document.createElement('button');btn.textContent='▶ JOUER '+(mine.legs.length?'LE RETOUR':'L’ALLER')+' CONTRE '+(mine.a===playerTeamName?mine.b:mine.a);btn.onclick=()=>{matchIndex=ms.indexOf(mine);menu.style.display='none';started=true;over=false;score=[0,0];beginTimedMatch();reset()};actions.append(btn)}else{const btn=document.createElement('button');btn.textContent='🤖 SIMULER LA SUITE DE LA COUPE';btn.onclick=()=>{let guard=0;while(!t.finished&&guard++<12){for(const m of t.rounds[t.round])while(m.sa===null)v18CupSimLeg(m);v18AdvanceCup()}showMainMenu()};actions.append(btn)}}
 const back=document.createElement('button');back.className='alt';back.textContent='MENU PRINCIPAL';back.onclick=()=>{saveCurrent();tournament=null;mode='quick';showMainMenu()};actions.append(back);addSavePanel();v18AddOptions();
}
// The existing V17 draw works for 8 teams only; adapt the reroll to the 16-team cup.
const v18OldReroll=v17Reroll;v17Reroll=function(){if(mode==='tournament'&&tournament?.cup16){if(tournament.round!==0||tournament.rounds[0].some(m=>m.legs.length)){alert('Tirage verrouillé après le premier match.');return}const entrants=v17DifferentShuffle(tournament.entrants);tournament.entrants=entrants;tournament.rounds=[[],[],[],[]];for(let i=0;i<8;i++)tournament.rounds[0].push({a:entrants[2*i],b:entrants[2*i+1],sa:null,sb:null,legs:[]});saveCurrent();showMainMenu();return}v18OldReroll()};
const v18OldShow=showMainMenu;showMainMenu=function(){if(mode==='tournament'&&tournament?.cup16){v18CupMenu();return}v18OldShow();v18AddOptions()};
// A world draw must never contain the same national team twice.
const v18OldWorld=newWorld;newWorld=function(){v18OldWorld();if(!competition||competition.type!=='world')return;const flat=competition.groups.flatMap(g=>g.names);if(new Set(flat).size!==16){alert('Erreur de tirage : équipes en double.');return}saveCurrent()};
// Avoid overwriting the user's roster while loading a save.
const v18OldOpen=openSave;openSave=function(i){v18OldOpen(i);if(tournament?.cup16){const x=saves[i];if(x?.team){playerTeamName=x.team;teamNames[0]=playerTeamName}}showMainMenu()};
showMainMenu();
</script></body></html>
