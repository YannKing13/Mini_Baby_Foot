{let names=Array.from(opp.querySelectorAll('input'),(x,i)=>x.value.trim().replace(/\s+/g,' ').slice(0,22).toUpperCase()||'ADVERSAIRE '+(i+1));if(new Set([playerTeamName,...names]).size!==8){alert('Chaque équipe doit avoir un nom différent.');return}let old=teamNames.slice(1);teamNames.splice(1,7,...names);opponentNames=names;try{localStorage.setItem('babyfoot_opponents',JSON.stringify(names))}catch(e){}if(tournament){let rename=n=>{let i=old.indexOf(n);return i<0?n:names[i]};tournament.entrants=tournament.entrants.map(rename);tournament.rounds.forEach(round=>round.forEach(m=>{m.a=rename(m.a);m.b=rename(m.b)}))}showMenu()};return w} function teamNameField(){let wrap=document.createElement('div');wrap.style.cssText='margin:7px auto 10px;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap';let label=document.createElement('label');label.textContent='✏️ NOM DE TON ÉQUIPE : ';label.htmlFor='teamname';let inp=document.createElement('input');inp.id='teamname';inp.maxLength=22;inp.value=playerTeamName;inp.autocomplete='off';inp.style.cssText='padding:9px;border-radius:8px;border:1px solid #6d94ad;background:#0d1b29;color:white;width:190px;max-width:45vw;font-weight:bold';let btn=document.createElement('button');btn.textContent='VALIDER';btn.onclick=()=>setTeamName(inp.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){inp.blur();setTeamName(inp.value)}});wrap.append(label,inp,btn);return wrap} const menu=document.getElementById('tmenu'),bracket=document.getElementById('bracket'),actions=document.getElementById('tactions'),status=document.getElementById('tstatus');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newTournament(){let opponents=shuffle(teamNames.slice(1));let entrants=shuffle([teamNames[0],...opponents]);tournament={round:0,rounds:[[],[],[]],entrants,finished:false};for(let i=0;i<4;i++)tournament.rounds[0].push({a:entrants[i*2],b:entrants[i*2+1]
